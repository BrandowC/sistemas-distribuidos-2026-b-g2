<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#3b82f6"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#22c55e"/>
    </marker>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#94a3b8"/>
    </marker>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1b2e"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <line x1="0" y1="122" x2="1400" y2="122" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <line x1="700" y1="122" x2="700" y2="700" stroke="#1e293b" stroke-width="1" opacity="0.5" stroke-dasharray="3,6"/>

  <!-- title -->
  <text x="700" y="56" text-anchor="middle" font-size="30" font-weight="800" fill="#f8fafc">Split for a reason, not for fashion</text>
  <text x="700" y="86" text-anchor="middle" font-size="15" fill="#94a3b8">Week 02 · context map → decision path → the one context that earns extraction</text>

  <!-- =============== LEFT: CONTEXT MAP =============== -->
  <text x="360" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">CONTEXT MAP</text>

  <!-- Orders (center) -->
  <g>
    <rect x="290" y="330" width="140" height="86" rx="14" fill="#111827" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="360" y="368" text-anchor="middle" font-size="24">🛒</text>
    <text x="360" y="392" text-anchor="middle" font-size="14" font-weight="800" fill="#dbeafe">Orders</text>
    <text x="360" y="408" text-anchor="middle" font-size="10" fill="#93c5fd">cart · checkout</text>
  </g>

  <!-- Payments (left) -->
  <g>
    <rect x="70" y="190" width="130" height="80" rx="14" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <text x="135" y="226" text-anchor="middle" font-size="22">💳</text>
    <text x="135" y="248" text-anchor="middle" font-size="13" font-weight="800" fill="#dbeafe">Payments</text>
    <text x="135" y="262" text-anchor="middle" font-size="9.5" fill="#93c5fd">charge · refund</text>
  </g>

  <!-- Inventory (right of payments, above orders) -->
  <g>
    <rect x="230" y="180" width="130" height="80" rx="14" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <text x="295" y="216" text-anchor="middle" font-size="22">🏬</text>
    <text x="295" y="238" text-anchor="middle" font-size="13" font-weight="800" fill="#dbeafe">Inventory</text>
    <text x="295" y="252" text-anchor="middle" font-size="9.5" fill="#93c5fd">stock · reserve</text>
  </g>

  <!-- Shipping (below orders) -->
  <g>
    <rect x="290" y="470" width="130" height="80" rx="14" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
    <text x="355" y="506" text-anchor="middle" font-size="22">🚚</text>
    <text x="355" y="528" text-anchor="middle" font-size="13" font-weight="800" fill="#dbeafe">Shipping</text>
    <text x="355" y="542" text-anchor="middle" font-size="9.5" fill="#93c5fd">deliver · track</text>
  </g>

  <!-- Catalog (right, will pulse/extract) -->
  <g>
    <circle cx="560" cy="390" r="66" fill="url(#glowGreen)">
      <animate attributeName="r" values="52;70;52" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="500" y="352" width="120" height="76" rx="14" fill="#111827" stroke="#22c55e" stroke-width="2.5"/>
    <text x="560" y="386" text-anchor="middle" font-size="22">🛍️</text>
    <text x="560" y="407" text-anchor="middle" font-size="13" font-weight="800" fill="#bbf7d0">Catalog</text>
    <text x="560" y="420" text-anchor="middle" font-size="9.5" fill="#86efac">listing · search</text>
  </g>

  <!-- relations -->
  <line x1="290" y1="345" x2="200" y2="255" stroke="#475569" stroke-width="1.8" marker-end="url(#arA)"/>
  <text x="220" y="290" font-size="10" fill="#64748b">places</text>
  <line x1="325" y1="330" x2="300" y2="262" stroke="#475569" stroke-width="1.8" marker-end="url(#arA)"/>
  <text x="335" y="290" font-size="10" fill="#64748b">reserves</text>
  <line x1="355" y1="416" x2="355" y2="468" stroke="#475569" stroke-width="1.8" marker-end="url(#arA)"/>
  <text x="368" y="446" font-size="10" fill="#64748b">ships</text>
  <line x1="430" y1="370" x2="498" y2="382" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arG)"/>
  <text x="450" y="362" font-size="10" fill="#4ade80">reads</text>

  <!-- moving packet: orders <-> catalog read, constant -->
  <circle r="6" fill="#4ade80">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 430,370 L 498,382"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- moving spike icons hitting Catalog -->
  <text font-size="16" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="1.4s" begin="0s" repeatCount="indefinite"/>
    <animateMotion dur="1.4s" begin="0s" repeatCount="indefinite" path="M 700,300 L 610,375"/>
    📈
  </text>
  <text font-size="16" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="1.4s" begin="0.45s" repeatCount="indefinite"/>
    <animateMotion dur="1.4s" begin="0.45s" repeatCount="indefinite" path="M 700,330 L 615,395"/>
    📈
  </text>
  <text font-size="16" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.7;1" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
    <animateMotion dur="1.4s" begin="0.9s" repeatCount="indefinite" path="M 700,360 L 610,410"/>
    📈
  </text>
  <text x="680" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#4ade80">Black-Friday spikes</text>

  <text x="360" y="592" text-anchor="middle" font-size="11.5" fill="#64748b" font-style="italic">boundaries follow language + data ownership — never DB tables or screens</text>

  <!-- =============== RIGHT: DECISION PATH =============== -->
  <text x="1040" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">EXTRACTION DECISION PATH</text>

  <!-- Q1 -->
  <g>
    <rect x="900" y="180" width="280" height="60" rx="12" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
    <text x="1040" y="207" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e2e8f0">Real, measured scaling need?</text>
    <text x="1040" y="224" text-anchor="middle" font-size="10" fill="#94a3b8">independent scale or deploy</text>
  </g>

  <line x1="900" y1="210" x2="800" y2="210" stroke="#475569" stroke-width="1.8" marker-end="url(#arA)"/>
  <text x="850" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">no</text>
  <g>
    <rect x="640" y="182" width="160" height="56" rx="10" fill="#111827" stroke="#475569" stroke-width="1.8"/>
    <text x="720" y="206" text-anchor="middle" font-size="11.5" font-weight="700" fill="#cbd5e1">stay in the</text>
    <text x="720" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#cbd5e1">modular monolith</text>
  </g>

  <line x1="1040" y1="240" x2="1040" y2="290" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arG)"/>
  <text x="1058" y="270" font-size="11" font-weight="700" fill="#4ade80">yes</text>

  <!-- Q2 -->
  <g>
    <rect x="900" y="296" width="280" height="60" rx="12" fill="#111827" stroke="#94a3b8" stroke-width="2"/>
    <text x="1040" y="323" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e2e8f0">Is the boundary real?</text>
    <text x="1040" y="340" text-anchor="middle" font-size="10" fill="#94a3b8">own language + own data already</text>
  </g>

  <line x1="900" y1="326" x2="800" y2="326" stroke="#475569" stroke-width="1.8" marker-end="url(#arA)"/>
  <text x="850" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">no</text>
  <g>
    <rect x="640" y="298" width="160" height="56" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="720" y="322" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fcd34d">refactor the</text>
    <text x="720" y="338" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fcd34d">module first</text>
  </g>

  <line x1="1040" y1="356" x2="1040" y2="406" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arG)"/>
  <text x="1058" y="386" font-size="11" font-weight="700" fill="#4ade80">yes — both true</text>

  <!-- extract -->
  <g>
    <circle cx="1040" cy="450" r="46" fill="url(#glowGreen)">
      <animate attributeName="r" values="38;52;38" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="450" r="34" fill="#111827" stroke="#22c55e" stroke-width="2.5"/>
    <text x="1040" y="459" text-anchor="middle" font-size="22">✂️</text>
  </g>
  <text x="1040" y="510" text-anchor="middle" font-size="13" font-weight="800" fill="#86efac">Extract Catalog</text>
  <text x="1040" y="528" text-anchor="middle" font-size="10.5" fill="#4ade80">own service · own store · own scale</text>

  <!-- packet flowing down the yes-path -->
  <circle r="6" fill="#4ade80">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 1040,240 L 1040,296 L 1040,356 L 1040,406"/>
    <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.5;0.9;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- =============== BOTTOM: ADR STAMP =============== -->
  <g>
    <rect x="40" y="660" width="1320" height="120" rx="14" fill="#111827" stroke="#3b82f6" stroke-width="1.8" opacity="0.95"/>
    <text x="66" y="694" font-size="14" font-weight="800" fill="#93c5fd">📄 ADR-001 — the decision, written down before anyone forgets why</text>
    <text x="66" y="720" font-size="12" fill="#cbd5e1">Decision: modular monolith + extract Catalog (only context with a real, measured scaling need).</text>
    <text x="66" y="740" font-size="12" fill="#cbd5e1">Rejected: 12 microservices day one (ops cost, no need yet) · pure monolith (wastes scale on flat contexts).</text>
    <text x="66" y="763" font-size="11.5" fill="#94a3b8" font-style="italic">Immutable once accepted — a later change is a new ADR that supersedes this one, never an edit.</text>
  </g>

  <text x="1360" y="808" text-anchor="end" font-size="10.5" fill="#475569">Distributed Systems · Week 02 · CORHUILA 2026-B</text>
</svg>
