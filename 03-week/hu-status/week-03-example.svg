<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#3b82f6"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#22c55e"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#f87171"/>
    </marker>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#94a3b8"/>
    </marker>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1b2e"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <line x1="0" y1="122" x2="1400" y2="122" stroke="#1e293b" stroke-width="1" opacity="0.6"/>
  <line x1="700" y1="122" x2="700" y2="700" stroke="#1e293b" stroke-width="1" opacity="0.5" stroke-dasharray="3,6"/>

  <!-- title -->
  <text x="700" y="56" text-anchor="middle" font-size="30" font-weight="800" fill="#f8fafc">A rule lives in one place, not scattered</text>
  <text x="700" y="86" text-anchor="middle" font-size="15" fill="#94a3b8">Week 03 · Amaranta's six business areas → business rules protected inside the aggregate</text>

  <!-- =============== LEFT: AREA MAP =============== -->
  <text x="360" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">AMARANTA — BUSINESS AREAS</text>

  <!-- Order (core) -->
  <g>
    <circle cx="255" cy="330" r="58" fill="url(#glowGreen)">
      <animate attributeName="r" values="46;60;46" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="195" y="292" width="120" height="78" rx="14" fill="#111827" stroke="#22c55e" stroke-width="2.5"/>
    <text x="255" y="326" text-anchor="middle" font-size="22">🛒</text>
    <text x="255" y="349" text-anchor="middle" font-size="13" font-weight="800" fill="#bbf7d0">Order</text>
    <text x="255" y="362" text-anchor="middle" font-size="9.5" fill="#86efac">core · owns its rules</text>
  </g>

  <!-- Appointment (core) -->
  <g>
    <circle cx="255" cy="480" r="58" fill="url(#glowGreen)">
      <animate attributeName="r" values="46;60;46" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <rect x="195" y="442" width="120" height="78" rx="14" fill="#111827" stroke="#22c55e" stroke-width="2.5"/>
    <text x="255" y="476" text-anchor="middle" font-size="22">📅</text>
    <text x="255" y="499" text-anchor="middle" font-size="13" font-weight="800" fill="#bbf7d0">Appointment</text>
    <text x="255" y="512" text-anchor="middle" font-size="9.5" fill="#86efac">core · owns its rules</text>
  </g>

  <!-- Catalog (support, top) -->
  <g>
    <rect x="55" y="185" width="118" height="70" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="114" y="216" text-anchor="middle" font-size="19">🛍️</text>
    <text x="114" y="236" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dbeafe">Catalog</text>
    <text x="114" y="248" text-anchor="middle" font-size="9" fill="#93c5fd">support · owns products</text>
  </g>

  <!-- Clinical History (support, bottom) -->
  <g>
    <rect x="55" y="550" width="118" height="70" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="114" y="581" text-anchor="middle" font-size="19">🩺</text>
    <text x="114" y="601" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dbeafe">Clinical History</text>
    <text x="114" y="613" text-anchor="middle" font-size="9" fill="#93c5fd">support · owns pet records</text>
  </g>

  <!-- Inventory (support, right of Order) -->
  <g>
    <rect x="440" y="248" width="118" height="70" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="499" y="279" text-anchor="middle" font-size="19">📦</text>
    <text x="499" y="299" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dbeafe">Inventory</text>
    <text x="499" y="311" text-anchor="middle" font-size="9" fill="#93c5fd">support</text>
  </g>

  <!-- Customers/Pets (support, right of Appointment) -->
  <g>
    <rect x="440" y="495" width="118" height="70" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="499" y="526" text-anchor="middle" font-size="19">🐾</text>
    <text x="499" y="546" text-anchor="middle" font-size="11.5" font-weight="700" fill="#dbeafe">Customers/Pets</text>
    <text x="499" y="558" text-anchor="middle" font-size="9" fill="#93c5fd">support</text>
  </g>

  <!-- ownership arrows: Order(Sales) reads Catalog, Appointment(Scheduling) reads Clinical History -->
  <line x1="200" y1="300" x2="150" y2="252" stroke="#4ade80" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arG)"/>
  <text x="128" y="278" font-size="9.5" fill="#4ade80">asks</text>
  <line x1="200" y1="505" x2="150" y2="552" stroke="#4ade80" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arG)"/>
  <text x="128" y="536" font-size="9.5" fill="#4ade80">asks</text>
  <line x1="313" y1="318" x2="440" y2="288" stroke="#475569" stroke-width="1.6" marker-end="url(#arA)"/>
  <line x1="313" y1="495" x2="440" y2="522" stroke="#475569" stroke-width="1.6" marker-end="url(#arA)"/>

  <!-- moving packets on the ownership reads -->
  <circle r="5" fill="#4ade80">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 200,300 L 150,252"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#4ade80">
    <animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite" path="M 200,505 L 150,552"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="290" y="655" text-anchor="middle" font-size="11.5" fill="#64748b" font-style="italic">6 areas ranked core vs support — each area owns its own data, no shared tables</text>

  <!-- =============== RIGHT: WHERE THE RULE LIVES =============== -->
  <text x="1040" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">WHERE DOES THE RULE LIVE?</text>
  <text x="1040" y="170" text-anchor="middle" font-size="10.5" fill="#64748b">Appointment: office-hours window + no double-booking</text>

  <!-- BEFORE: rule in the web handler -->
  <g>
    <circle cx="900" cy="260" r="40" fill="url(#glowRed)"/>
    <rect x="850" y="220" width="100" height="80" rx="12" fill="#111827" stroke="#ef4444" stroke-width="2"/>
    <text x="900" y="256" text-anchor="middle" font-size="20">🌐</text>
    <text x="900" y="278" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fca5a5">Web handler</text>
    <text x="900" y="291" text-anchor="middle" font-size="8.5" fill="#fca5a5">validates on request</text>
  </g>
  <text x="1000" y="245" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f87171">✗ BEFORE</text>
  <text x="1000" y="262" text-anchor="middle" font-size="9.5" fill="#94a3b8">draft: rule checked</text>
  <text x="1000" y="276" text-anchor="middle" font-size="9.5" fill="#94a3b8">outside the Appointment</text>
  <text x="1000" y="290" text-anchor="middle" font-size="9.5" fill="#94a3b8">— can be skipped elsewhere</text>

  <line x1="900" y1="304" x2="900" y2="350" stroke="#f87171" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arR)"/>

  <!-- arrow moving to AFTER -->
  <text x="900" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">moved into ↓</text>

  <!-- AFTER: rule inside the Appointment aggregate -->
  <g>
    <circle cx="900" cy="470" r="52" fill="url(#glowGreen)">
      <animate attributeName="r" values="42;56;42" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <rect x="838" y="424" width="124" height="92" rx="14" fill="#111827" stroke="#22c55e" stroke-width="2.5"/>
    <text x="900" y="464" text-anchor="middle" font-size="22">📅</text>
    <text x="900" y="488" text-anchor="middle" font-size="12" font-weight="800" fill="#bbf7d0">Appointment</text>
    <text x="900" y="503" text-anchor="middle" font-size="9" fill="#86efac">rule enforced inside</text>
  </g>
  <text x="1050" y="452" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">✓ AFTER</text>
  <text x="1050" y="470" text-anchor="middle" font-size="9.5" fill="#94a3b8">office-hours window +</text>
  <text x="1050" y="484" text-anchor="middle" font-size="9.5" fill="#94a3b8">no-overlap enforced by</text>
  <text x="1050" y="498" text-anchor="middle" font-size="9.5" fill="#94a3b8">the Appointment itself —</text>
  <text x="1050" y="512" text-anchor="middle" font-size="9.5" fill="#94a3b8">no path around it</text>

  <!-- packet flowing before -> after -->
  <circle r="6" fill="#fbbf24">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 900,304 L 900,420"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="900" y="545" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">a validation that lives outside its object is a rule waiting to be bypassed</text>

  <!-- =============== BOTTOM: EVIDENCE STAMP =============== -->
  <g>
    <rect x="40" y="660" width="1320" height="120" rx="14" fill="#111827" stroke="#3b82f6" stroke-width="1.8" opacity="0.95"/>
    <text x="66" y="690" font-size="14" font-weight="800" fill="#93c5fd">🐾 Amaranta — Pet Shop &amp; Veterinary Clinic · Sprint 3</text>
    <text x="66" y="712" font-size="12" fill="#cbd5e1">Rule moved: office-hours + no-overlap now live inside Appointment, not in the request handler.</text>
    <text x="66" y="732" font-size="12" fill="#cbd5e1">Ownership fixed: Order asks Catalog · Appointment asks Clinical History — no shared tables across areas.</text>
    <text x="66" y="754" font-size="11" fill="#94a3b8" font-style="italic">Process risk: course material in English, delivery in Spanish — solved with one shared ES/EN glossary, not weekly re-translation.</text>
    <text x="66" y="770" font-size="10.5" fill="#64748b">Commit "Arquitectura de amaranta" · github.com/BrandowC/amaranta-shop-docs</text>
  </g>

  <text x="1360" y="808" text-anchor="end" font-size="10.5" fill="#475569">Distributed Systems · Week 03 · CORHUILA 2026-B</text>
</svg>
