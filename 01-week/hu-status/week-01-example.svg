<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#1d4ed8"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#15803d"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#b91c1c"/>
    </marker>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f1b2e"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="120" x2="1400" y2="120"/>
    <line x1="0" y1="640" x2="1400" y2="640"/>
  </g>

  <!-- title -->
  <text x="700" y="56" text-anchor="middle" font-size="30" font-weight="800" fill="#f8fafc">Place Order — during a network partition</text>
  <text x="700" y="86" text-anchor="middle" font-size="15" fill="#94a3b8">Week 01 · Session 1 + Session 2 · watch the packet route around the failure</text>

  <!-- ===================== NODES ===================== -->
  <!-- Customer -->
  <g>
    <circle cx="120" cy="380" r="46" fill="#111827" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="120" y="373" text-anchor="middle" font-size="26">🧑</text>
    <text x="120" y="445" text-anchor="middle" font-size="14" font-weight="700" fill="#93c5fd">Customer</text>
  </g>

  <!-- Orders -->
  <g>
    <rect x="330" y="330" width="150" height="100" rx="14" fill="#111827" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="405" y="372" text-anchor="middle" font-size="28">📦</text>
    <text x="405" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#dbeafe">Orders</text>
    <text x="405" y="418" text-anchor="middle" font-size="11" fill="#93c5fd">saga orchestrator</text>
  </g>

  <!-- Inventory -->
  <g>
    <rect x="660" y="150" width="150" height="100" rx="14" fill="#111827" stroke="#22c55e" stroke-width="2.5"/>
    <text x="735" y="192" text-anchor="middle" font-size="28">🏬</text>
    <text x="735" y="220" text-anchor="middle" font-size="15" font-weight="800" fill="#bbf7d0">Inventory</text>
    <text x="735" y="238" text-anchor="middle" font-size="11" fill="#86efac">reserve · strong</text>
  </g>

  <!-- Payments -->
  <g>
    <rect x="660" y="510" width="150" height="100" rx="14" fill="#111827" stroke="#ef4444" stroke-width="2.5"/>
    <text x="735" y="552" text-anchor="middle" font-size="28">💳</text>
    <text x="735" y="580" text-anchor="middle" font-size="15" font-weight="800" fill="#fecaca">Payments</text>
    <text x="735" y="598" text-anchor="middle" font-size="11" fill="#fca5a5">charge card</text>
  </g>

  <!-- Partition glow + bolt on the Orders->Payments line -->
  <g>
    <circle cx="590" cy="470" r="60" fill="url(#glowRed)">
      <animate attributeName="r" values="46;66;46" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="590" y="480" text-anchor="middle" font-size="34">⚡</text>
    <text x="590" y="512" text-anchor="middle" font-size="12" font-weight="800" fill="#f87171">PARTITION</text>
  </g>

  <!-- Confirm target -->
  <g>
    <rect x="990" y="330" width="150" height="100" rx="14" fill="#111827" stroke="#a855f7" stroke-width="2.5"/>
    <text x="1065" y="372" text-anchor="middle" font-size="28">✅</text>
    <text x="1065" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#e9d5ff">Confirmed</text>
    <text x="1065" y="418" text-anchor="middle" font-size="11" fill="#d8b4fe">OrderConfirmed</text>
  </g>

  <!-- ===================== PATHS ===================== -->
  <!-- customer -> orders -->
  <line x1="166" y1="380" x2="322" y2="380" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arB)"/>

  <!-- orders -> inventory (success path) -->
  <path id="pInv" d="M 405,330 C 405,270 550,220 660,200" fill="none" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arG)"/>

  <!-- inventory -> confirm -->
  <path id="pConfirm" d="M 810,210 C 950,230 1010,290 1055,328" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arG)"/>

  <!-- orders -> payments (broken path) -->
  <path d="M 405,430 C 405,500 550,540 660,555" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arR)"/>

  <!-- compensation: payments fail -> orders retries -->
  <path d="M 660,600 C 520,650 420,600 400,470" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arB)" opacity="0.85"/>
  <text x="470" y="672" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">retry + idempotency key</text>

  <!-- ===================== MOVING PACKETS ===================== -->
  <!-- packet 1: customer -> orders, looping -->
  <circle r="7" fill="#60a5fa">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 166,380 L 322,380"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- packet 2: orders -> inventory, succeeds -->
  <circle r="7" fill="#4ade80">
    <animateMotion dur="2.4s" begin="0.5s" repeatCount="indefinite" path="M 405,330 C 405,270 550,220 660,200"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- packet 3: inventory -> confirm -->
  <circle r="7" fill="#c084fc">
    <animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M 810,210 C 950,230 1010,290 1055,328"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- packet 4: orders -> payments, dies at the partition -->
  <circle r="7" fill="#f87171">
    <animateMotion dur="1.8s" begin="0.2s" repeatCount="indefinite" path="M 405,430 C 405,480 500,510 580,530"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
  </circle>

  <!-- packet 5: retry with idempotency key, loops back -->
  <circle r="7" fill="#fbbf24">
    <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M 660,600 C 520,650 420,600 400,470"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- ===================== LABELS ON PATHS ===================== -->
  <text x="500" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#4ade80">reserve stock ✓</text>
  <text x="500" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#f87171">charge card ✗ unreachable</text>
  <text x="950" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#c084fc">confirm</text>

  <!-- ===================== ORDER STATE BADGE (animated text swap) ===================== -->
  <g>
    <rect x="330" y="450" width="150" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="405" y="472" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="4s" repeatCount="indefinite"/>
      status: pending…
      <animate attributeName="x" values="405" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ===================== BOTTOM STRIP: the two lessons ===================== -->
  <g>
    <rect x="40" y="660" width="640" height="80" rx="12" fill="#111827" stroke="#ef4444" stroke-width="1.5" opacity="0.9"/>
    <text x="60" y="686" font-size="13" font-weight="800" fill="#fca5a5">✗ Naive: one big transaction, blocked on a lock</text>
    <text x="60" y="708" font-size="12" fill="#cbd5e1">Payments hangs → pool exhausts → whole checkout freezes.</text>
    <text x="60" y="726" font-size="12" fill="#cbd5e1">This is the classic production outage.</text>
  </g>
  <g>
    <rect x="720" y="660" width="640" height="80" rx="12" fill="#111827" stroke="#22c55e" stroke-width="1.5" opacity="0.9"/>
    <text x="740" y="686" font-size="13" font-weight="800" fill="#86efac">✓ Saga: reserve → charge → confirm, compensate on failure</text>
    <text x="740" y="708" font-size="12" fill="#cbd5e1">Idempotency key on retry, honest "pending" shown to the user —</text>
    <text x="740" y="726" font-size="12" fill="#cbd5e1">exactly-once processing, not exactly-once delivery.</text>
  </g>

  <text x="1360" y="750" text-anchor="end" font-size="10.5" fill="#475569">Distributed Systems · Week 01 · CORHUILA 2026-B</text>
</svg>
